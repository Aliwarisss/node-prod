<!doctype html>
<html lang="en">
<head>
<script src="../shared/gate.js?v=4"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Node SDLC Book</title>
<meta name="description" content="Node SDLC training program — the operating model and roadmap as an interactive book." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" rel="stylesheet" />
<style>
  :root {
    --bg: #fdf8f8;
    --ink: #040505;
    --text: #1c1b1b;
    --muted: #5b5f60;
    --faint: #8a8e8f;
    --line: rgba(0,0,0,.07);
    --stone: #f6f4f3;
    --teal: #008080;
    --pink: #e91e63;
    --orange: #ff5722;
    --indigo: #0d1117;
    --r: 14px;
    --sb: 248px;
    --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, monospace;
    --head: "Montserrat", var(--sans);
    --ease: cubic-bezier(.22,1,.36,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { max-width: 100vw; overflow-x: clip; }
  body { background: var(--bg); color: var(--text); font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  ::selection { background: var(--teal); color: #fff; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .ms { font-family: "Material Symbols Outlined"; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; display: inline-block; font-size: 18px; flex: none; font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 20; }
  .lbl { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
  .dotgrid { background-image: radial-gradient(circle, rgba(255,255,255,.14) 1px, transparent 1px); background-size: 26px 26px; }

  /* ---------- shell ---------- */
  .book { display: grid; grid-template-columns: var(--sb) minmax(0,1fr); min-height: 100vh; }
  .sidebar { position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; background: var(--indigo); color: #fff; display: flex; flex-direction: column; z-index: 60; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.12) transparent; }
  .sb-head { padding: 14px 14px 12px; border-bottom: 1px solid rgba(255,255,255,.07); }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-mark { width: 28px; height: 28px; display: grid; place-items: center; background: #fff; color: var(--indigo); border-radius: 9px; }
  .brand-mark .ms { font-size: 16px; }
  .brand b { font: 900 17px var(--head); letter-spacing: -.02em; }
  .brand .lbl { margin-left: auto; color: rgba(255,255,255,.35); font-size: 9px; }
  .prog { margin-top: 12px; display: flex; align-items: center; gap: 8px; }
  .prog .bar { flex: 1; height: 3px; border-radius: 9px; background: rgba(255,255,255,.08); overflow: hidden; }
  .prog .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--pink)); transition: width .5s var(--ease); }
  .prog .lbl { color: var(--teal); letter-spacing: .1em; }
  .sbtn { margin-top: 10px; width: 100%; display: flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 9px; border: 1px solid rgba(255,255,255,.1); color: rgba(255,255,255,.5); font-size: 12.5px; }
  .sbtn:hover { color: #fff; border-color: rgba(255,255,255,.25); }
  .sbtn .ms { font-size: 16px; }
  kbd { font: 700 9.5px var(--mono); padding: 1px 5px; border-radius: 4px; border: 1px solid rgba(255,255,255,.15); margin-left: auto; }
  .toc { padding: 4px 8px 20px; flex: 1; }
  .toc-part { margin-top: 14px; }
  .toc-part > .lbl { display: block; font-size: 9px; color: var(--pink); padding: 0 8px 5px; letter-spacing: .25em; }
  .toc a { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,.6); position: relative; }
  .toc a:hover { background: rgba(255,255,255,.05); color: #fff; }
  .toc a.active { background: rgba(0,128,128,.18); color: #fff; }
  .toc a.active::before { content: ""; position: absolute; left: -8px; top: 22%; bottom: 22%; width: 3px; border-radius: 0 3px 3px 0; background: var(--teal); }
  .toc .tn { font: 700 9.5px var(--mono); color: rgba(255,255,255,.28); min-width: 22px; }
  .toc a.active .tn { color: var(--teal); }
  .toc .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toc .chk { font-size: 14px; color: rgba(255,255,255,.1); }
  .toc a.read .chk { color: var(--teal); font-variation-settings: "FILL" 1; }
  .toc .st { font: 700 8.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; background: rgba(255,255,255,.06); color: rgba(255,255,255,.35); }
  .subs { margin: 1px 0 4px 30px; border-left: 1px solid rgba(255,255,255,.08); }
  .subs a { font-size: 11.5px; font-weight: 500; padding: 3px 8px; border-radius: 0 6px 6px 0; color: rgba(255,255,255,.42); }
  .subs a .ms { font-size: 12px; color: rgba(255,255,255,.2); }
  .subs a.open .ms { color: var(--teal); }
  .sb-foot { padding: 10px 14px; border-top: 1px solid rgba(255,255,255,.07); color: rgba(255,255,255,.35); display: flex; align-items: center; gap: 6px; }
  .live { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 8px var(--teal); }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 20px; background: rgba(253,248,248,.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
  .ib { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  .ib:hover:not(:disabled) { border-color: var(--teal); color: var(--teal); }
  .ib:disabled { opacity: .3; cursor: default; }
  .menu-btn { display: none; }
  .crumbs { display: flex; gap: 6px; align-items: center; min-width: 0; color: var(--faint); }
  .crumbs b { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tb-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .pno { color: var(--faint); letter-spacing: .08em; margin-right: 4px; }
  .readbar { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: var(--teal); }

  .stage { padding: 18px 20px 40px; flex: 1; }
  .sheet { max-width: 1120px; margin: 0 auto; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 24px 28px 18px; }
  .sheet.tn { animation: tn .4s var(--ease); } .sheet.tp { animation: tp .4s var(--ease); }
  @keyframes tn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
  @keyframes tp { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .sheet.tn, .sheet.tp { animation: none; } }

  /* ---------- page primitives ---------- */
  .ph { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 20px; padding-bottom: 16px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .ph .lbl { display: block; color: var(--acc, var(--teal)); margin-bottom: 6px; }
  .ph h1 { font: 900 26px/1.05 var(--head); letter-spacing: -.035em; color: var(--ink); }
  .ph p { margin-top: 6px; color: var(--muted); max-width: 70ch; font-size: 14px; }
  .ph .right { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--acc, var(--teal)) 40%, transparent); color: var(--acc, var(--teal)); font: 700 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .badge .ms { font-size: 14px; }
  .badge.ph-st { border-color: var(--line); color: var(--faint); }
  .badge.draft { border-color: #f5b80066; color: #b58900; }
  .badge.confirmed { border-color: #00808066; color: var(--teal); }
  .sec { display: flex; align-items: center; gap: 8px; color: var(--faint); margin: 0 0 8px; }
  .sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .blk + .blk { margin-top: 18px; }
  .cols { display: grid; gap: 18px 24px; }
  @media (min-width: 880px) { .cols { grid-template-columns: 1fr 1fr; } .cols.c-37 { grid-template-columns: 3fr 7fr; } .cols.c-73 { grid-template-columns: 7fr 3fr; } }
  .cols + .cols, .cols + .blk, .blk + .cols { margin-top: 18px; }
  .grid { display: grid; gap: 8px; }
  .g2 { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .g4 { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .tile { display: block; padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--line); background: #fff; transition: border-color .2s, transform .2s; }
  a.tile:hover, button.tile:hover { border-color: var(--acc, var(--teal)); transform: translateY(-1px); }
  .tile .lbl { color: var(--acc, var(--teal)); font-size: 9.5px; letter-spacing: .14em; }
  .tile b { display: block; font-size: 13.5px; font-weight: 800; color: var(--ink); margin-top: 2px; }
  .tile p { font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
  .tile.dashed { border-style: dashed; }
  .tile.soft { background: var(--stone); border-color: transparent; }
  .note { padding: 9px 12px; border-radius: 10px; background: var(--stone); border-left: 3px solid var(--nc, var(--teal)); font-size: 12.5px; color: var(--muted); }
  .note b { color: var(--ink); }
  .list { list-style: none; display: grid; gap: 4px; }
  .list li { display: flex; gap: 7px; align-items: flex-start; font-size: 13.5px; }
  .list .ms { font-size: 16px; color: var(--teal); margin-top: 1px; }
  .fade { animation: fd .3s var(--ease); }
  @keyframes fd { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .dark { background: var(--indigo); color: #fff; border-radius: var(--r); padding: 14px 16px; }
  .dark .lbl { color: var(--teal); }
  .dark p { color: rgba(255,255,255,.6); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  a.chip:hover { border-color: var(--teal); color: var(--teal); }
  .chip.req { background: var(--teal); border-color: var(--teal); color: #fff; }
  .chip.app { border-color: color-mix(in srgb, var(--teal) 40%, transparent); color: var(--teal); }
  .chip .ms { font-size: 13px; }
  .chip.k { border-color: color-mix(in srgb, var(--kc) 35%, transparent); color: var(--text); }
  .chip.k::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--kc); }
  .chip.dk { border-color: rgba(255,255,255,.14); color: rgba(255,255,255,.75); font: 700 10.5px var(--mono); }

  /* stepper */
  .stepper { position: relative; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .stepper::-webkit-scrollbar { display: none; }
  .step { flex: 1 0 auto; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 9px; border: 1px solid var(--line); background: #fff; font: 700 10.5px var(--mono); letter-spacing: .06em; color: var(--muted); white-space: nowrap; }
  .step .ms { font-size: 15px; }
  .step:hover { border-color: var(--acc); color: var(--acc); }
  .step.on { background: var(--acc); border-color: var(--acc); color: #fff; }

  /* process rows */
  .rows { list-style: none; display: grid; gap: 4px; }
  .row { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); }
  .row .n { font: 700 10.5px var(--mono); color: var(--acc, var(--teal)); }
  .row b { font-size: 13.5px; font-weight: 800; color: var(--ink); }
  .row span.s { display: block; font-size: 12px; color: var(--muted); line-height: 1.35; }
  .row .ms { color: #c9cccd; font-size: 15px; }
  a.row:hover { border-color: var(--acc, var(--teal)); }
  a.row .ms { color: var(--acc, var(--teal)); }
  .route { display: grid; grid-template-columns: 92px 1fr; gap: 8px; align-items: baseline; padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .route:last-child { border-bottom: 0; }
  .route .k { display: inline-flex; align-items: center; gap: 4px; font: 700 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--rc); }
  .route .k .ms { font-size: 13px; }
  .route span:last-child { color: var(--muted); }

  /* cover */
  .cover { max-width: 1120px; margin: 0 auto; border-radius: 18px; background: var(--indigo); color: #fff; padding: 32px 32px 28px; position: relative; overflow: hidden; }
  .cover .glow { position: absolute; right: -60px; top: -60px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(0,128,128,.35), transparent 70%); pointer-events: none; }
  .cover .lbl { color: var(--teal); }
  .cover h1 { font: 900 clamp(40px, 7vw, 72px)/.88 var(--head); letter-spacing: -.055em; text-transform: uppercase; margin-top: 14px; }
  .cover h1 span { color: var(--pink); }
  .cover p { margin-top: 12px; max-width: 56ch; color: rgba(255,255,255,.6); font-size: 14.5px; }
  .cover .stats { display: flex; flex-wrap: wrap; gap: 26px; margin-top: 20px; }
  .cover .stats b { display: block; font-size: 24px; font-weight: 900; line-height: 1; }
  .cover .stats .lbl { font-size: 9px; }
  .cover .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 11px; font-size: 12.5px; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; }
  .btn.pink { background: var(--pink); color: #fff; box-shadow: 0 12px 28px -10px rgba(233,30,99,.55); }
  .btn.ghost { border: 1.5px solid rgba(255,255,255,.2); }
  .btn.ghost:hover { background: #fff; color: var(--indigo); }
  .btn .ms { font-size: 16px; }
  .contents { max-width: 1120px; margin: 14px auto 0; display: grid; gap: 10px; }
  @media (min-width: 880px) { .contents { grid-template-columns: repeat(3, 1fr); } }
  .contents .part { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .contents .part > .lbl { color: var(--pink); display: block; margin-bottom: 8px; }
  .contents a { display: flex; gap: 8px; padding: 4px 0; font-size: 13px; font-weight: 600; color: var(--text); }
  .contents a:hover { color: var(--teal); }
  .contents a .lbl { color: var(--faint); min-width: 26px; letter-spacing: .05em; padding-top: 2px; }

  /* tabs (vertical) */
  .vtabs { display: grid; gap: 3px; align-content: start; }
  .vtab { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 9px; text-align: left; font-size: 13px; font-weight: 700; color: var(--muted); border: 1px solid transparent; }
  .vtab .ms { font-size: 16px; color: var(--faint); }
  .vtab .lbl { margin-left: auto; color: var(--faint); letter-spacing: .05em; }
  .vtab:hover { background: var(--stone); color: var(--ink); }
  .vtab[aria-selected="true"] { background: var(--ink); color: #fff; }
  .vtab[aria-selected="true"] .ms, .vtab[aria-selected="true"] .lbl { color: var(--teal); }
  .panel { border-radius: var(--r); background: var(--stone); padding: 14px 16px; }
  .panel h3 { font: 900 19px var(--head); letter-spacing: -.03em; color: var(--ink); }
  .panel .q { color: var(--muted); font-size: 13px; margin: 3px 0 10px; }
  .fields { display: grid; gap: 4px; }
  .field { display: grid; grid-template-columns: 120px 1fr; gap: 10px; padding: 6px 10px; border-radius: 8px; background: #fff; font-size: 13px; }
  .field b { font-weight: 800; color: var(--ink); }
  .field span { color: var(--muted); }
  .field.gap span { color: #c0c3c4; font-style: italic; }
  @media (max-width: 520px) { .field { grid-template-columns: 1fr; gap: 0; } }

  /* levels */
  .lvl { display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
  .lvl .n { font: 900 13px var(--mono); color: var(--lc); min-width: 20px; }
  .lvl b { font-size: 13.5px; font-weight: 800; color: var(--ink); display: block; }
  .lvl span.d { font-size: 12px; color: var(--muted); }
  .lvl[aria-selected="true"] { border-color: var(--lc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lc) 12%, transparent); }
  .exrow { display: flex; gap: 8px; padding: 5px 8px; border-radius: 7px; border: 1px solid rgba(255,255,255,.08); font-size: 12.5px; margin-top: 4px; }
  .exrow .lbl { min-width: 82px; color: rgba(255,255,255,.35); font-size: 9px; padding-top: 2px; }
  .exrow.on { border-color: color-mix(in srgb, var(--lc) 60%, transparent); background: color-mix(in srgb, var(--lc) 14%, transparent); }
  .exrow.on .lbl { color: var(--lc); }

  /* routing map */
  .toggles { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .tg { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 99px; border: 1.5px solid var(--line); font: 700 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
  .tg i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .tg[aria-pressed="true"] { border-color: var(--c); }
  .tg[aria-pressed="false"] { opacity: .4; }
  .mapbox { border-radius: var(--r); background: var(--stone); padding: 8px; overflow-x: auto; }
  .rmap { display: block; width: 100%; min-width: 640px; height: auto; }
  .rmap .arc { fill: none; stroke-width: 1.5; transition: opacity .25s; }
  .rmap .arc.hide { opacity: 0; } .rmap .arc.dim { opacity: .1; } .rmap .arc.hl { stroke-width: 2.6; }
  .rmap .sn { cursor: pointer; }
  .rmap text { font-family: var(--mono); }
  .loop { display: grid; grid-template-columns: 8px 1fr; column-gap: 7px; align-items: baseline; padding: 6px 9px; border-radius: 9px; border: 1px solid var(--line); font-size: 12.5px; }
  .loop i { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .loop b { font-weight: 800; color: var(--ink); }
  .loop span { grid-column: 2; font: 700 9px var(--mono); letter-spacing: .08em; color: var(--c); }
  .loop.hl { border-color: var(--c); }

  /* flow map widget */
  .mapw { display: grid; gap: 8px; }
  .map-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; }
  .map-top .toggles { margin: 0; }
  .trail { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; color: var(--faint); letter-spacing: .1em; }
  .trail a, .trail button { color: var(--muted); padding: 2px 4px; border-radius: 5px; font: inherit; letter-spacing: inherit; text-transform: inherit; }
  .trail a:hover, .trail button:hover { color: var(--teal); background: color-mix(in srgb, var(--teal) 8%, transparent); }
  .trail b, .trail [aria-current="true"] { color: var(--ink); }
  .trail .open { margin-left: 6px; display: inline-flex; align-items: center; gap: 3px; color: #fff; background: var(--ink); padding: 3px 8px; border-radius: 7px; }
  .trail .open:hover { background: var(--teal); color: #fff; }
  .trail .open .ms { font-size: 13px; }
  .ph + .trail { margin: -8px 0 8px; }
  .rmap .sn.go { cursor: pointer; }
  .rmap .sn.go:hover rect, .rmap .sn.go:focus rect { stroke: var(--teal); stroke-width: 2; }
  .rmap .sn:focus { outline: none; }
  .map-empty { display: grid; justify-items: center; gap: 4px; padding: 30px 12px; text-align: center; color: var(--muted); font-size: 13px; }
  .map-empty .ms { font-size: 26px; color: var(--faint); }
  .map-empty b { color: var(--ink); font-size: 14px; }

  /* ===== interactive map box ===== */
  .mapw { border: 1px solid var(--line); border-radius: 16px; background: #fff; padding: 10px; gap: 10px; }
  .map-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .mapw .mapbox { padding: 6px; }
  .rmap { min-width: 760px; }
  .rmap .hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; pointer-events: stroke; }
  .rmap .bar { cursor: pointer; }

  .mx-body { display: grid; }

  /* full screen map */
