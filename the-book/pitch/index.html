<!doctype html>
<html lang="en">
<head>
<script src="../shared/gate.js?v=4"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Node Pitch Deck</title>
<meta name="description" content="Node — develop apps end to end with agentic AI. The pitch, slide by slide." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" rel="stylesheet" />
<style>
  :root { --bg: #fdf8f8; --ink: #040505; --text: #1c1b1b; --muted: #5b5f60; --faint: #8a8e8f; --line: #ece8e6; --stone: #f6f4f3;
    --teal: #008080; --aqua: #4fd1c5; --pink: #e91e63; --violet: #6d48d8; --amber: #c49000; --indigo: #0d1117;
    --sans: "Geist", ui-sans-serif, system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace; --head: "Montserrat", var(--sans);
    --ease: cubic-bezier(.22,1,.36,1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--indigo); }
  body { color: var(--text); font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .ms { font-family: "Material Symbols Outlined"; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; -webkit-font-feature-settings: "liga"; font-feature-settings: "liga"; }

  /* the deck: full-screen slides that snap */
  #deck { height: 100dvh; overflow-y: auto; scroll-snap-type: y mandatory; scroll-behavior: smooth; overscroll-behavior: contain; scrollbar-width: none; }
  #deck::-webkit-scrollbar { display: none; }
  .slide { position: relative; height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; display: grid; place-items: center; padding: 84px clamp(20px, 6vw, 96px) 72px; }
  .slide.dark { background: var(--indigo); color: #fff; }
  .slide.light { background: var(--bg); color: var(--text); }
  .slide.pink { background: var(--pink); color: #fff; }
  .dots::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px); background-size: 24px 24px; pointer-events: none; }
  .light.dots::before { background-image: radial-gradient(rgba(0,0,0,.06) 1px, transparent 1px); }
  .inner { position: relative; z-index: 1; width: min(1180px, 100%); transform-origin: center center; }
  .center { text-align: center; }

  /* type */
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; font: 700 12px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--teal); margin-bottom: 18px; }
  .dark .eyebrow { color: var(--aqua); }
  .pink .eyebrow { color: rgba(255,255,255,.75); }
  .eyebrow i { width: 26px; height: 2px; background: currentColor; display: inline-block; }
  h1, h2 { font-family: var(--head); font-weight: 900; text-transform: uppercase; letter-spacing: -.045em; line-height: .92; }
  h1 { font-size: clamp(2.8rem, 7.6vw, 7.4rem); }
  h2 { font-size: clamp(2.1rem, 5vw, 4.6rem); }
  .accent { color: var(--pink); }
  .pink .accent { color: var(--indigo); }
  .lead { font-size: clamp(16px, 1.6vw, 21px); color: var(--muted); max-width: 720px; margin-top: 20px; }
  .dark .lead { color: rgba(255,255,255,.66); }
  .center .lead { margin-left: auto; margin-right: auto; }

  /* entrance animations — replay every time a slide becomes active */
  [data-a] { opacity: 0; transition: opacity .8s var(--ease), transform .9s var(--ease); transition-delay: calc(var(--d, 0) * 90ms + 120ms); }
  [data-a="up"] { transform: translateY(34px); }
  [data-a="left"] { transform: translateX(-40px); }
  [data-a="right"] { transform: translateX(40px); }
  [data-a="scale"] { transform: scale(.88); }
  [data-a="fade"] { transform: none; }
  .on [data-a] { opacity: 1; transform: none; }
  .measuring [data-a] { transform: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) { [data-a] { opacity: 1; transform: none; transition: none; } #deck { scroll-behavior: auto; } }

  /* chrome */
  .chrome { position: fixed; inset: 0 0 auto 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 18px clamp(16px, 3vw, 32px); pointer-events: none; mix-blend-mode: normal; }
  .chrome > * { pointer-events: auto; }
  .logo { display: flex; align-items: center; gap: 8px; font: 900 19px var(--head); letter-spacing: -.03em; transition: color .4s; }
  .logo i { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-style: normal; transition: background .4s, color .4s; }
  .logo i .ms { font-size: 18px; }
  body[data-tone="dark"] .logo, body[data-tone="pink"] .logo { color: #fff; }
  body[data-tone="dark"] .logo i, body[data-tone="pink"] .logo i { background: #fff; color: var(--indigo); }
  body[data-tone="light"] .logo { color: var(--ink); }
  body[data-tone="light"] .logo i { background: var(--ink); color: #fff; }
  .chrome .sp { flex: 1; }
  .pill-btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px; font: 800 11.5px var(--sans); letter-spacing: .1em; text-transform: uppercase; background: var(--pink); color: #fff; box-shadow: 0 12px 30px -12px rgba(233,30,99,.6); }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; transition: background .3s, color .3s; }
  body[data-tone="light"] .icon-btn { color: var(--ink); background: rgba(0,0,0,.05); }
  body[data-tone="dark"] .icon-btn, body[data-tone="pink"] .icon-btn { color: #fff; background: rgba(255,255,255,.1); }
  .rail { position: fixed; right: clamp(10px, 2vw, 26px); top: 50%; transform: translateY(-50%); z-index: 20; display: grid; gap: 9px; }
  .rail button { position: relative; width: 10px; height: 10px; border-radius: 50%; transition: transform .3s var(--ease), background .3s; }
  body[data-tone="light"] .rail button { background: rgba(0,0,0,.18); }
  body[data-tone="dark"] .rail button, body[data-tone="pink"] .rail button { background: rgba(255,255,255,.28); }
  .rail button.on { transform: scale(1.5); background: var(--pink) !important; }
  body[data-tone="pink"] .rail button.on { background: #fff !important; }
  .rail button span { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); white-space: nowrap; font: 700 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; background: var(--ink); color: #fff; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .rail button:hover span { opacity: 1; }
  @media (max-width: 640px) { .rail { display: none; } }
  .foot { position: fixed; left: clamp(16px, 3vw, 32px); bottom: 18px; z-index: 20; display: flex; align-items: center; gap: 14px; font: 700 12px var(--mono); letter-spacing: .12em; transition: color .4s; }
  body[data-tone="light"] .foot { color: var(--muted); }
  body[data-tone="dark"] .foot, body[data-tone="pink"] .foot { color: rgba(255,255,255,.6); }
  .foot b { font-size: 15px; }
  body[data-tone="light"] .foot b { color: var(--ink); }
  body[data-tone="dark"] .foot b, body[data-tone="pink"] .foot b { color: #fff; }
  .foot .nav { display: flex; gap: 6px; }
  .bar { position: fixed; left: 0; bottom: 0; height: 3px; z-index: 20; background: var(--pink); width: 0; transition: width .6s var(--ease); }
  body[data-tone="pink"] .bar { background: #fff; }
  .hint { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); display: grid; justify-items: center; gap: 8px; font: 700 11px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.5); }
  .hint .ms { animation: bob 1.8s ease-in-out infinite; color: var(--aqua); }
  @keyframes bob { 50% { transform: translateY(8px); } }

  /* S1 title */
  .net { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .5; }
  .net line { stroke: rgba(79,209,197,.25); stroke-width: 1; stroke-dasharray: 4 6; animation: flow 8s linear infinite; }
  .net circle { fill: var(--aqua); animation: pulse 3.2s ease-in-out infinite; }
  .net circle.p { fill: var(--pink); }
  @keyframes flow { to { stroke-dashoffset: -100; } }
  @keyframes pulse { 50% { opacity: .25; } }
  .glow { position: absolute; width: 640px; height: 640px; border-radius: 50%; filter: blur(20px); pointer-events: none; animation: drift 14s ease-in-out infinite alternate; }
  .glow.a { background: radial-gradient(circle, rgba(233,30,99,.32), transparent 62%); top: -200px; right: -160px; }
  .glow.b { background: radial-gradient(circle, rgba(0,128,128,.34), transparent 62%); bottom: -260px; left: -180px; animation-delay: -6s; }
  @keyframes drift { to { transform: translate(-60px, 50px) scale(1.1); } }
  .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 28px; }
  .tags span { padding: 8px 15px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); font: 700 11.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.8); }

  /* cards */
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 40px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 40px; }
  @media (max-width: 860px) { .grid3, .grid4 { grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 24px; } }
  @media (max-width: 520px) { .grid3 { grid-template-columns: 1fr; } }
  .card { padding: 24px; border-radius: 22px; background: #fff; border: 1px solid var(--line); }
  .dark .card { background: rgba(255,255,255,.04); border-color: rgba(255,255,255,.1); }
  .card .ms { font-size: 30px; color: var(--pink); }
  .card b { display: block; font: 900 clamp(15px, 1.4vw, 19px)/1.15 var(--head); text-transform: uppercase; letter-spacing: -.01em; margin: 14px 0 8px; }
  .card p { font-size: clamp(13.5px, 1.1vw, 15px); color: var(--muted); }
  .dark .card p { color: rgba(255,255,255,.62); }
  .card.hot { background: var(--indigo); color: #fff; border-color: var(--indigo); }
  .card.hot p { color: rgba(255,255,255,.7); }
  @media (max-width: 860px) { .card { padding: 16px; } .card p { display: none; } .card b { margin: 8px 0 0; } }

  /* S3 developer → engineer */
  .shift { display: grid; grid-template-columns: 1fr auto 1fr; gap: 26px; align-items: center; margin-top: 40px; }
  @media (max-width: 760px) { .shift { grid-template-columns: 1fr; gap: 12px; margin-top: 20px; } .shift .arrow { transform: rotate(90deg); justify-self: center; } }
  .role { padding: 26px; border-radius: 24px; border: 1px solid rgba(255,255,255,.12); }
  .role.eng { background: rgba(233,30,99,.12); border-color: rgba(233,30,99,.45); }
  .role h3 { font: 900 clamp(22px, 2.6vw, 34px) var(--head); text-transform: uppercase; letter-spacing: -.03em; margin-bottom: 14px; }
  .role ul { list-style: none; display: grid; gap: 10px; font-size: clamp(14px, 1.2vw, 16px); color: rgba(255,255,255,.7); }
  .role.eng ul { color: #fff; font-weight: 600; }
  .role li span { display: block; font: 700 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.38); margin-bottom: 2px; }
  @media (max-width: 760px) { .role { padding: 16px; } .role ul li:nth-child(n+3) { display: none; } }
  .arrow { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--pink); color: #fff; }
  .arrow .ms { font-size: 32px; }
  .big-quote { margin-top: 30px; font: 900 clamp(18px, 2vw, 26px)/1.2 var(--head); text-transform: uppercase; letter-spacing: -.02em; }
  .big-quote span { color: var(--aqua); }

  /* S4 meet node */
  .mega { font-size: clamp(5rem, 18vw, 15rem); line-height: .8; letter-spacing: -.06em; }

  /* S5 project-based steps */
  .track { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 50px; }
  .track svg { position: absolute; left: 0; top: 30px; width: 100%; height: 4px; overflow: visible; }
  .track svg line { stroke: url(#tg); stroke-width: 3; stroke-dasharray: 1200; stroke-dashoffset: 1200; transition: stroke-dashoffset 1.6s var(--ease) .3s; }
  .on .track svg line { stroke-dashoffset: 0; }
  .step { position: relative; }
  .step .n { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; background: var(--pink); color: #fff; box-shadow: 0 0 0 8px var(--indigo); margin-bottom: 18px; }
  .step .n .ms { font-size: 28px; }
  .step b { display: block; font: 900 clamp(16px, 1.7vw, 21px) var(--head); text-transform: uppercase; letter-spacing: -.01em; margin-bottom: 6px; }
  .step p { font-size: clamp(13.5px, 1.15vw, 15.5px); color: rgba(255,255,255,.62); }
  @media (max-width: 760px) { .track { grid-template-columns: 1fr 1fr; margin-top: 26px; gap: 16px; } .track svg { display: none; } .step .n { width: 46px; height: 46px; margin-bottom: 8px; } }

  /* the model — eight acts, three tracks */
  .life { display: grid; grid-template-columns: repeat(8, 1fr); gap: 16px 10px; margin-top: 40px; }
  .band { padding: 10px 14px; border-radius: 14px; border-top: 3px solid var(--c); background: color-mix(in srgb, var(--c) 9%, transparent); }
  .band b { display: flex; align-items: center; gap: 6px; font: 900 12.5px var(--head); text-transform: uppercase; letter-spacing: .02em; color: var(--c); }
  .band b .ms { font-size: 17px; }
  .band em { display: block; font-style: normal; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .act { position: relative; text-align: center; }
  .act::before { content: ""; position: absolute; top: 22px; left: 50%; width: calc(100% + 10px); height: 2px; background: var(--c); opacity: .45; transform: scaleX(0); transform-origin: left; transition: transform .6s var(--ease); transition-delay: calc(var(--d, 0) * 90ms + 420ms); }
  .on .act::before { transform: scaleX(1); }
  .act:last-child::before { display: none; }
  .act .dot { position: relative; z-index: 1; width: 46px; height: 46px; margin: 0 auto 12px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: 2px solid var(--c); color: var(--c); font: 900 14px var(--head); }
  .act.open .dot { background: var(--pink); border-color: var(--pink); color: #fff; animation: ping 2.4s ease-out infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(233,30,99,.45); } 70%, 100% { box-shadow: 0 0 0 14px rgba(233,30,99,0); } }
  .act b { display: block; font: 900 clamp(12px, 1.15vw, 15px) var(--head); text-transform: uppercase; color: var(--ink); }
  .act p { font-size: clamp(12px, 1vw, 13.5px); line-height: 1.35; color: var(--muted); margin: 4px 0 10px; min-height: 2.7em; }
  .act .gate { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 999px; background: var(--stone); font: 700 9.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .act .gate .ms { font-size: 13px; color: var(--c); }
  .act.open .gate { background: rgba(233,30,99,.1); color: var(--pink); }
  .act.open .gate .ms { color: var(--pink); }
  .life-note { display: flex; gap: 12px; align-items: center; margin-top: 30px; max-width: 860px; font-size: clamp(14px, 1.25vw, 17px); color: var(--text); }
  .life-note .ms { font-size: 30px; color: var(--pink); }
  @media (max-width: 860px) { .life { grid-template-columns: repeat(4, 1fr); margin-top: 22px; gap: 14px 6px; } .band, .act::before { display: none; } .act p { display: none; } .act .gate { font-size: 8.5px; padding: 3px 6px; } .act .dot { width: 38px; height: 38px; margin-bottom: 6px; } .life-note { margin-top: 18px; } }

  /* zoom in — levels ladder + contract */
  .ladder { list-style: none; margin-top: 30px; display: grid; gap: 8px; }
  .ladder li { margin-left: calc(var(--i) * clamp(10px, 2vw, 26px)); padding: 10px 16px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); border-left: 3px solid var(--aqua); }
  .ladder li:last-child { border-left-color: var(--pink); background: rgba(233,30,99,.1); }
  .ladder span { display: block; font: 700 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--aqua); }
  .ladder li:last-child span { color: #ff8fb4; }
  .ladder em { font-style: normal; color: rgba(255,255,255,.4); letter-spacing: .06em; }
  .ladder b { display: block; font-size: clamp(14px, 1.3vw, 17px); color: #fff; font-weight: 700; }
  .contract { padding: clamp(18px, 2.4vw, 30px); border-radius: 24px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); }
  .contract .k { font: 700 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--pink); }
  .contract h3 { font: 900 clamp(18px, 2vw, 26px)/1.1 var(--head); text-transform: uppercase; letter-spacing: -.02em; margin: 8px 0 18px; }
  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chips .cy { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.1); font-size: 14px; font-weight: 600; color: rgba(255,255,255,.75); text-align: left; transition: background .35s, border-color .35s, color .35s, transform .35s var(--ease); }
  .chips .cy .ms { font-size: 18px; color: var(--aqua); transition: color .35s; }
  .chips .cy.act { background: var(--pink); border-color: var(--pink); color: #fff; transform: translateX(4px); }
  .chips .cy.act .ms { color: #fff; }
  .contract .q { margin-top: 16px; min-height: 3em; font-size: clamp(14px, 1.3vw, 17px); color: #fff; font-weight: 600; }
  .swap { animation: fadein .5s var(--ease); }
  @media (max-width: 900px) { .ladder { margin-top: 14px; gap: 5px; } .ladder li { padding: 6px 10px; } .ladder em { display: none; } .chips { grid-template-columns: 1fr 1fr 1fr; gap: 5px; } .chips .cy { padding: 6px 8px; font-size: 12px; } .chips .cy .ms { display: none; } .contract h3 { margin-bottom: 10px; } }

  /* the book */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 28px; }
  .stats div { padding: 12px 14px; border-radius: 16px; background: #fff; border: 1px solid var(--line); }
  .stats b { display: block; font: 900 clamp(22px, 2.6vw, 34px) var(--head); letter-spacing: -.03em; color: var(--ink); }
  .stats span { font-size: 12.5px; color: var(--muted); }
  .book { border-radius: 20px; background: #fff; border: 1px solid var(--line); box-shadow: 0 50px 90px -50px rgba(0,0,0,.45); overflow: hidden; }
  .book .term-bar { background: var(--indigo); }
  .book-body { display: grid; grid-template-columns: 170px 1fr; min-height: 340px; }
  .book aside { padding: 12px 8px; background: var(--stone); border-right: 1px solid var(--line); display: grid; align-content: start; gap: 2px; font-size: 12px; }
  .book aside div { display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 7px; color: var(--muted); font-weight: 600; }
  .book aside div i { width: 22px; font: 800 10px var(--mono); font-style: normal; color: var(--faint); }
  .book aside div .ms { margin-left: auto; font-size: 13px; color: var(--faint); }
  .book aside .o { color: var(--ink); } .book aside .o i { color: var(--pink); }
  .book aside .sub { padding-left: 34px; font-weight: 500; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .book aside .sub.act { background: var(--ink); color: #fff; }
  .page { padding: 16px 18px; display: grid; gap: 10px; align-content: start; min-width: 0; }
  .crumb { font: 600 10.5px var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .page h4 { font: 900 clamp(17px, 1.7vw, 22px) var(--head); text-transform: uppercase; letter-spacing: -.02em; color: var(--ink); }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  .tabs .cy { padding: 5px 10px; border-radius: 999px; font: 700 10.5px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: var(--stone); cursor: pointer; transition: background .35s, color .35s; }
  .tabs .cy.act { background: var(--teal); color: #fff; }
  .tab-q { min-height: 2.8em; font-size: 13.5px; color: var(--text); }
  .prompt { border-radius: 12px; background: var(--indigo); padding: 10px 12px; }
  .prompt div { display: flex; justify-content: space-between; align-items: center; font: 700 9.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--aqua); }
  .prompt em { display: inline-flex; align-items: center; gap: 4px; font-style: normal; padding: 3px 8px; border-radius: 999px; background: var(--pink); color: #fff; }
  .prompt em .ms { font-size: 12px; }
  .prompt code { display: block; margin-top: 6px; font: 11.5px/1.5 var(--mono); color: #c9d1d9; }
  .chips2 { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips2 > span { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 11.5px; font-weight: 600; color: var(--text); }
  .chips2 .ms { font-size: 15px; color: var(--pink); }
